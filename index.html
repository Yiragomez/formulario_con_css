<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro y Pokédex</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <h1>Formulario de Contacto</h1>

    <form id="FormularioRegistro">

        <!-- Nombre -->
        <div class="form-group">

            <label for="nombre">
                Nombre:
            </label>

            <input type="text"id="nombre" name="nombre" placeholder="Carlos" required>

        </div>


  
        <div class="form-group">

            <label for="apellido"> Apellido: </label>
            <input type="text"id="apellido"name="apellido"placeholder="Pérez"required>

        </div>


        <div class="form-group">

            <label for="pais">
                País:
            </label>

            <select id="pais" name="pais"required>

                <option value="">
                    Seleccionar
                </option>

                <option value="169 - Colombia">
                    Colombia
                </option>

                <option value="149 - Canada">
                    Canadá
                </option>

                <option value="850 - Venezuela">
                    Venezuela
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="ciudad">Ciudad:</label>
            <select id="ciudad"name="ciudad"required >

                <option value="">Seleccione una opción </option>

                <optgroup label="Colombia">

                    <option value="11001 - Bogotá D.C.">Bogotá D.C.</option>
                    <option value="05001 - Medellín">Medellín</option>
                    <option value="76001 - Cali">Cali</option>
                    <option value="08001 - Barranquilla">Barranquilla</option>
                    <option value="13001 - Cartagena">Cartagena</option>

                </optgroup>


                <optgroup label="Canadá">

                    <option value="3520005 - Toronto">Toronto</option>
                    <option value="2466023 - Montréal">Montréal</option>
                    <option value="5915022 - Vancouver">Vancouver</option>
                    <option value="4806016 - Calgary">Calgary</option>
                    <option value="4811061 - Edmonton">Edmonton</option>

                </optgroup>


                <optgroup label="Venezuela">

                    <option value="01001 - Caracas">Caracas </option>
                    <option value="24001 - Maracaibo">Maracaibo</option>
                    <option value="08001 - Valencia">Valencia</option>
                    <option value="11001 - Barquisimeto">Barquisimeto</option>
                    <option value="02001 - Barcelona">Barcelona</option>
                
                  </optgroup>

            </select>

        </div>


    
        <div class="form-group">

            <label for="tipo_documento">Tipo de Documento:</label>
            <select id="tipo_documento"name="tipo_documento"required >

                <option value="">Seleccionar</option>
                <option value="CC">CC</option>
                <option value="TI">TI</option>
                <option value="CE">CE</option>
                <option value="PAS">PAS</option>

            </select>

        </div>


      
        <div class="form-group">

            <label for="numero_identificacion">Número de Identificación:</label>
            <input type="text" id="numero_identificacion" name="numero_identificacion"placeholder="1233489498"required>

        </div>



        <div class="form-group">

            <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>

        </div>


        <div class="form-group">

            <label for="celular">Número de Celular:</label>
            <input type="tel" id="celular" name="celular" placeholder="300 000 00 00" required>

        </div>


        <div class="politica">

            <input type="checkbox" id="datos_personales" name="datos_personales" required>
            <label for="datos_personales">
                Acepto la política de tratamiento de datos personales.
            </label>

        </div>


        <button type="submit" class="btn-submit">
            Enviar Registro
        </button>

    </form>


    <script src="js/script.js"></script>

</body>

</html>
